<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>
  <rect width="1200" height="360" fill="#111214"/>

  <text x="64" y="84" class="mono" font-size="13" letter-spacing="3" fill="#E3714E">MOBILE APP DEVELOPER</text>
  <text x="64" y="160" class="serif" font-size="58" fill="#ECE7DF">From first screen</text>
  <text x="64" y="226" class="serif" font-size="58" font-style="italic" fill="#ECE7DF">to live release.</text>
  <text x="64" y="268" class="mono" font-size="13" fill="#8F897F">Flutter · FlutterFlow · React Native · iOS &amp; Android</text>

  <!-- 01 screen -->
  <g transform="translate(680 72)" fill="none" stroke="#ECE7DF" stroke-linecap="round">
    <rect width="72" height="150" rx="12" stroke-width="1.5"/>
    <line x1="28" y1="10" x2="44" y2="10" stroke-width="1.5"/>
    <rect x="12" y="28" width="48" height="28" rx="3" stroke-dasharray="3 3"/>
    <line x1="12" y1="70" x2="60" y2="70" stroke-width="1.5" opacity=".45"/>
    <line x1="12" y1="80" x2="48" y2="80" stroke-width="1.5" opacity=".45"/>
    <line x1="12" y1="90" x2="54" y2="90" stroke-width="1.5" opacity=".45"/>
  </g>

  <!-- 02 ai layer -->
  <g transform="translate(772 72)" fill="none" stroke="#ECE7DF" stroke-linecap="round">
    <rect width="72" height="150" rx="12" stroke-width="1.5"/>
    <line x1="28" y1="10" x2="44" y2="10" stroke-width="1.5"/>
    <rect x="10" y="30" width="38" height="14" rx="7"/>
    <rect x="24" y="52" width="38" height="14" rx="7" fill="#E3714E" stroke="none"/>
    <rect x="10" y="74" width="30" height="14" rx="7"/>
    <circle cx="16" cy="102" r="2" fill="#ECE7DF" stroke="none" opacity=".3"/>
    <circle cx="24" cy="102" r="2" fill="#ECE7DF" stroke="none" opacity=".6"/>
    <circle cx="32" cy="102" r="2" fill="#ECE7DF" stroke="none"/>
  </g>

  <!-- 03 backend -->
  <g transform="translate(864 72)" fill="none" stroke="#ECE7DF" stroke-linecap="round">
    <rect width="72" height="150" rx="12" stroke-width="1.5"/>
    <line x1="28" y1="10" x2="44" y2="10" stroke-width="1.5"/>
    <circle cx="18" cy="32" r="5"/><line x1="30" y1="32" x2="60" y2="32" stroke-width="1.5"/>
    <circle cx="18" cy="54" r="5"/><line x1="30" y1="54" x2="54" y2="54" stroke-width="1.5"/>
    <circle cx="18" cy="76" r="5"/><line x1="30" y1="76" x2="58" y2="76" stroke-width="1.5"/>
    <circle cx="18" cy="98" r="5"/><line x1="30" y1="98" x2="50" y2="98" stroke-width="1.5"/>
  </g>

  <!-- 04 payments -->
  <g transform="translate(956 72)" fill="none" stroke="#ECE7DF" stroke-linecap="round">
    <rect width="72" height="150" rx="12" stroke-width="1.5"/>
    <line x1="28" y1="10" x2="44" y2="10" stroke-width="1.5"/>
    <rect x="10" y="30" width="52" height="32" rx="5"/>
    <rect x="16" y="37" width="10" height="8" rx="1.5" fill="#E3714E" stroke="none"/>
    <line x1="16" y1="54" x2="42" y2="54" stroke-width="1.5"/>
    <rect x="10" y="118" width="52" height="14" rx="7" fill="#ECE7DF" stroke="none"/>
  </g>

  <!-- 05 release -->
  <g transform="translate(1048 72)" stroke-linecap="round" stroke-linejoin="round">
    <rect width="72" height="150" rx="12" fill="#ECE7DF"/>
    <line x1="28" y1="10" x2="44" y2="10" stroke="#111214" stroke-width="1.5"/>
    <circle cx="36" cy="78" r="15" fill="#E3714E"/>
    <path d="M29 78 L34 83 L43 73" fill="none" stroke="#111214" stroke-width="2"/>
  </g>

  <g class="mono" font-size="11" fill="#8F897F" text-anchor="middle">
    <text x="716" y="248">01 screen</text>
    <text x="808" y="248">02 ai layer</text>
    <text x="900" y="248">03 backend</text>
    <text x="992" y="248">04 payments</text>
    <text x="1084" y="248">05 release</text>
  </g>

  <line x1="64" y1="300" x2="1136" y2="300" stroke="#ECE7DF" stroke-width="1" opacity=".5"/>
  <text x="64" y="330" class="mono" font-size="12" fill="#8F897F">AI: OpenAI · Claude · Gemini</text>
  <text x="1136" y="330" class="mono" font-size="12" fill="#8F897F" text-anchor="end">available 40 h/week · long-term</text>
</svg>
